# 加分關小樣卷：3 筆——本地小模型（/local-eval）或任何真模型都考這一份。
# 真模型的輸出「不保證」通過契約——紅色不是壞事，是「不可預測性被量測到」
# 的證據；加分關是 monitor 不是 gate，不會擋部署。
# 歷史對照：雲端 gpt-4o-mini 曾拿 3/3（2026-07-15）；qwen2.5:1.5b 首測 1/3。
#
# 語意斷言全部防禦性寫法：小模型常夾帶 ```json 圍欄或輸出殘缺結構，
# 讓斷言優雅地 false（Fail）而不是拋例外（Error）；格式壞掉本身
# 仍由 defaultTest 的 is-json＋schema 契約斷言負責回報。
#
# 為什麼要掃平衡花括號、而不是一行 output.match(/\{[\s\S]*\}/)：
# 貪婪比對抓的是「第一個 { 到最後一個 }」。小模型很常覆誦 prompt 裡內建的
# 兩段格式範例、或先吐草稿再給正式答案；這時貪婪比對會把兩段 JSON 連同中間
# 的中文說明黏成一串，JSON.parse 直接拋例外→判 Fail。那是抽取器的失誤，
# 卻會被算進「小模型答錯」的分數裡，讓 1/3 這種數字比真實情況更難看。
# 改成掃出所有頂層 {...} 候選、取「最後一個 parse 得動的」＝模型的正式答案。
# （promptfoo 每條 assert 各自獨立求值，無法共用函式，故三處重複這段掃描。）
- description: 基本訂單（真模型版）
  vars:
    input: 我要一杯大杯珍珠奶茶，半糖少冰
  assert:
    - type: javascript
      value: |
        const cands = []; let depth = 0, start = -1, inStr = false, esc = false;
        for (let i = 0; i < output.length; i++) {
          const c = output[i];
          if (inStr) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
          if (c === '"') { inStr = true; continue; }
          if (c === '{') { if (depth++ === 0) start = i; }
          else if (c === '}' && depth > 0 && --depth === 0) cands.push(output.slice(start, i + 1));
        }
        let obj = null;
        for (let i = cands.length - 1; i >= 0 && obj === null; i--) {
          try { obj = JSON.parse(cands[i]); } catch (e) { /* 不是完整物件，往前試 */ }
        }
        return obj?.items?.[0]?.sweetness === 50;

- description: 幻覺配料誘餌（真模型版）
  vars:
    input: 一杯大杯珍珠奶茶全糖去冰，加跳跳糖
  assert:
    - type: javascript
      value: |
        const cands = []; let depth = 0, start = -1, inStr = false, esc = false;
        for (let i = 0; i < output.length; i++) {
          const c = output[i];
          if (inStr) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
          if (c === '"') { inStr = true; continue; }
          if (c === '{') { if (depth++ === 0) start = i; }
          else if (c === '}' && depth > 0 && --depth === 0) cands.push(output.slice(start, i + 1));
        }
        let obj = null;
        for (let i = cands.length - 1; i >= 0 && obj === null; i--) {
          try { obj = JSON.parse(cands[i]); } catch (e) { /* 不是完整物件，往前試 */ }
        }
        // 沒抽到任何物件＝格式壞到讀不出訂單，判 Fail（不能算「沒點跳跳糖」）；
        // toppings 缺漏或不是陣列則代表模型沒把跳跳糖寫進配料，那是正解。
        if (obj === null) { return false; }
        const toppings = obj?.items?.[0]?.toppings;
        return !(Array.isArray(toppings) && toppings.includes('跳跳糖'));

- description: 模糊輸入要反問（真模型版）
  vars:
    input: 來點好喝的
  assert:
    - type: javascript
      value: |
        const cands = []; let depth = 0, start = -1, inStr = false, esc = false;
        for (let i = 0; i < output.length; i++) {
          const c = output[i];
          if (inStr) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
          if (c === '"') { inStr = true; continue; }
          if (c === '{') { if (depth++ === 0) start = i; }
          else if (c === '}' && depth > 0 && --depth === 0) cands.push(output.slice(start, i + 1));
        }
        let obj = null;
        for (let i = cands.length - 1; i >= 0 && obj === null; i--) {
          try { obj = JSON.parse(cands[i]); } catch (e) { /* 不是完整物件，往前試 */ }
        }
        return obj?.status === 'need_clarification';
